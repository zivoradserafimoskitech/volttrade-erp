name: Deploy VoltTrade Risk Module

# One-click deploy of the Risk & Analytics module.
# Target path in repo: .github/workflows/deploy-risk-module.yml
#
# ── REPAIRS vs. the original upload ─────────────────────────────────────────
# FIX 1: The original file was INVALID YAML — the embedded SQL heredoc was
#        written at column 0, which terminated the `run: |` block at line 96.
#        The DDL now lives in a proper migration file instead:
#        supabase/migrations/20260901090000_risk_module.sql  (commit it too!)
# FIX 2: `supabase db push --file` does not exist. The database job now uses
#        psql against the Session Pooler connection string (secret
#        SUPABASE_DB_URL). This also fixes the IPv6 problem: db.<ref>.supabase.co
#        is IPv6-only and GitHub-hosted runners have no IPv6.
# FIX 3: Removed `needs:` between the three jobs so the input toggles work
#        independently (previously, unchecking one job skipped all later jobs).
# FIX 4: `supabase login --token` is deprecated; the CLI now authenticates via
#        the SUPABASE_ACCESS_TOKEN environment variable.
#
# ── REQUIRED GITHUB SECRETS ──────────────────────────────────────────────────
# Repo → Settings → Secrets and variables → Actions → New repository secret:
#   SUPABASE_ACCESS_TOKEN     Supabase Dashboard → Account → Access Tokens
#   SUPABASE_DB_URL           Supabase Dashboard → Connect → "Session pooler" URI,
#                             e.g. postgresql://postgres.<ref>:<password>@aws-0-<region>.pooler.supabase.com:5432/postgres
#   VOLTTRADE_ANALYTICS_URL   https://volttrade-analytics.onrender.com
#   VOLTTRADE_ANALYTICS_KEY   the analytics service API key
#
# FIX 5 (security, 2026-09-01): --no-verify-jwt has been REMOVED.
#        The note that used to sit here claimed "the 5 risk functions
#        authenticate callers internally". That was true of two of them.
#        forecast-price, optimize-hedge and ingest-memo had no Authorization
#        handling at all, and risk-metrics skipped its check whenever org_id was
#        supplied in the body — so the flag exposed cross-tenant risk data and
#        an open write path into market_price_history.
#        All five now use supabase/functions/_shared/auth.ts. The platform gate
#        stays ON: Supabase accepts the service-role key as a valid JWT, so
#        pg_cron still gets through.
# ═════════════════════════════════════════════════════════════════════════════

on:
  workflow_dispatch:
    inputs:
      supabase_project_ref:
        description: 'Supabase project ref (Settings → General)'
        required: true
        type: string
      deploy_edge_functions:
        description: 'Deploy the 5 risk edge functions?'
        required: true
        type: boolean
        default: true
      run_database_setup:
        description: 'Apply risk-module migration (6 tables, 2 views, columns)?'
        required: true
        type: boolean
        default: true
      set_secrets:
        description: 'Set VOLTTRADE_ANALYTICS_* Supabase secrets?'
        required: true
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  deploy-functions:
    name: Deploy edge functions
    runs-on: ubuntu-latest
    if: ${{ inputs.deploy_edge_functions }}
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link project
        run: supabase link --project-ref "${{ inputs.supabase_project_ref }}"

      - name: Deploy risk edge functions
        run: |
          set -e
          for fn in quote-supply risk-metrics forecast-price optimize-hedge ingest-memo; do
            echo "Deploying $fn..."
            supabase functions deploy "$fn"
          done
          echo "All 5 edge functions deployed."

  setup-database:
    name: Apply database migration
    runs-on: ubuntu-latest
    if: ${{ inputs.run_database_setup }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Apply risk-module migration
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -e
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "::error::SUPABASE_DB_URL secret is not set. Use the Session pooler URI from Supabase Dashboard → Connect."
            exit 1
          fi
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 \
            -f supabase/migrations/20260901090000_risk_module.sql
          echo "Risk-module migration applied (6 tables, 2 views, shape_mask(), column additions, backfill)."

  set-secrets:
    name: Set Supabase secrets
    runs-on: ubuntu-latest
    if: ${{ inputs.set_secrets }}
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link project
        run: supabase link --project-ref "${{ inputs.supabase_project_ref }}"

      - name: Set analytics secrets
        env:
          ANALYTICS_URL: ${{ secrets.VOLTTRADE_ANALYTICS_URL }}
          ANALYTICS_KEY: ${{ secrets.VOLTTRADE_ANALYTICS_KEY }}
        run: |
          set -e
          if [ -z "$ANALYTICS_KEY" ]; then
            echo "::error::VOLTTRADE_ANALYTICS_KEY secret is not set."
            exit 1
          fi
          supabase secrets set VOLTTRADE_ANALYTICS_URL="${ANALYTICS_URL:-https://volttrade-analytics.onrender.com}"
          supabase secrets set VOLTTRADE_ANALYTICS_KEY="$ANALYTICS_KEY"
          echo "Secrets configured."

  summary:
    name: Deployment summary
    runs-on: ubuntu-latest
    needs: [deploy-functions, setup-database, set-secrets]
    if: always()
    steps:
      - name: Print summary
        run: |
          echo "═══════════════════════════════════════════════════════════════"
          echo "  VOLTRADE RISK MODULE — DEPLOYMENT SUMMARY"
          echo "═══════════════════════════════════════════════════════════════"
          echo "  deploy-functions: ${{ needs.deploy-functions.result }}"
          echo "  setup-database:   ${{ needs.setup-database.result }}"
          echo "  set-secrets:      ${{ needs.set-secrets.result }}"
          echo ""
          echo "Already done in the repo (no action needed):"
          echo "  • React routes for /risk/hedge, /risk/metrics, /forecasting/models, /quote-builder"
          echo "  • Python analytics service live on Render"
          echo ""
          echo "Still manual:"
          echo "  1. Set VITE_VOLTTRADE_ANALYTICS_URL in Lovable environment variables"
          echo "  2. Test /risk/hedge and /quote-builder in the app"
          echo "═══════════════════════════════════════════════════════════════"
